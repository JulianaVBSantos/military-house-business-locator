<html lang='pt-BR'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Mapa das Lojas</title>
    <link rel='stylesheet' href='https://unpkg.com/leaflet/dist/leaflet.css'/>
    <script src='https://unpkg.com/leaflet/dist/leaflet.js'></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        #topo {
            background: #7f1d1d;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #caixaPesquisa {
            position: relative;
            display: flex;
            align-items: center;
        }
#pesquisa {
 padding: 10px 10px 10px 40px;
 width: 320px;
 border-radius: 8px;
 border: none;
 font-size: 14px;
 background-color: white;
background: #fff url("https://cdn-icons-png.flaticon.com/512/622/622669.png") no-repeat 12px center;
background-size: 18px;
 background-repeat: no-repeat;
  background-position: 12px center;
}
        .tipoBusca {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #991b1b;
            color: white;
            font-weight: bold;
        }
        .tipoBusca.ativo {
            background: #dc2626;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #991b1b;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background: #b91c1c;
        }
        #map {
            width: 100%;
            height: calc(100vh - 70px);
        }
        #painel {
            position: absolute;
            top: 90px;
            right: 15px;
            z-index: 999;
            background: white;
            padding: 15px;
            border-radius: 12px;
            width: 280px;
            max-height: 350px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #painel h3 {
            margin-top: 0;
            color: #7f1d1d;
        }
        #painel ul {
            padding-left: 18px;
        }
        #resultadoBusca {
            position: absolute;
            top: 130px;
            left: 15px;
            z-index: 999;
            background: white;
            padding: 15px;
            border-radius: 12px;
            width: 300px;
            max-height: 350px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
        }
        #resultadoBusca h3 {
            margin-top: 0;
            color: #7f1d1d;
        }
        #resultadoBusca ul {
            padding-left: 18px;
        }
        #fecharPainel {
            float: right;
            background: #dc2626;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
<div id='topo'>
    <div id='caixaPesquisa'>
        <input type='text' id='pesquisa' placeholder='Pesquisar loja, cidade ou CEPMG...'>
    </div>
    <button class='tipoBusca ativo' onclick="alterarTipo('nome', this)">Nome</button>
    <button class='tipoBusca' onclick="alterarTipo('cidade', this)">Cidade</button>
    <button class='tipoBusca' onclick="alterarTipo('cepmg', this)">CEPMG</button>
    <button onclick='location.reload()'>Atualizar mapa</button>
</div>
<div id='map'></div>
<div id='painel' style='display:none;'>
    <h3>Lojas sem coordenadas</h3>
    <ul id='listaSemCoordenadas'></ul>
</div>
<div id='resultadoBusca'>
    <button id='fecharPainel' onclick='fecharResultados()'>X</button>
    <h3>Resultados encontrados</h3>
    <ul id='listaResultados'></ul>
</div>

function normalizarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
}
function distancia(lat1, lon1, lat2, lon2)
{
let R = 6371;
let dLat =
(lat2-lat1) * Math.PI / 180;
 let dLon =
 (lon2-lon1) * Math.PI / 180;
 let a =
  Math.sin(dLat/2) *
  Math.sin(dLat/2) +
  Math.cos(lat1*Math.PI/180) *
 Math.cos(lat2*Math.PI/180) *
  Math.sin(dLon/2) *
 Math.sin(dLon/2);
 let c =
 2 *
 Math.atan2(
    Math.sqrt(a),
   Math.sqrt(1-a)
 );
 return R * c;
}
